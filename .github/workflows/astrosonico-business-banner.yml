name: Genera banner Business
on:
  push:
    paths:
      - .github/workflows/astrosonico-business-banner.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Adatta la grafica al box editoriale
        shell: bash
        run: |
          python3 -m pip install --user -q Pillow
          python3 - <<'PY'
          from PIL import Image,ImageOps,ImageDraw
          from pathlib import Path
          src=Image.open('assets/img/astro-business-editoriale.webp').convert('RGB')
          W,H=960,680
          out=Image.new('RGB',(W,H),(13,12,14))
          left=src.crop((0,0,round(src.width*.56),src.height))
          left.thumbnail((round(W*.55),H-30),Image.Resampling.LANCZOS)
          out.paste(left,(6,(H-left.height)//2))
          right_crop=src.crop((round(src.width*.54),0,src.width,src.height))
          right=ImageOps.fit(right_crop,(W-470,H),Image.Resampling.LANCZOS,centering=(.55,.5))
          out.paste(right,(470,0))
          fade=Image.new('RGBA',(W,H),(0,0,0,0))
          pen=ImageDraw.Draw(fade)
          for x in range(436,502):
              opacity=int(105*(1-abs(x-469)/33))
              pen.line((x,0,x,H),fill=(10,9,11,max(0,opacity)))
          out=Image.alpha_composite(out.convert('RGBA'),fade).convert('RGB')
          path=Path('assets/img/astro-business-featured.webp')
          out.save(path,format='WEBP',quality=86,method=6)
          print("Banner generato:", path, out.size, path.stat().st_size,flush=True)
          PY
      - name: Salva il nuovo banner su GitHub
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/img/astro-business-featured.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Aggiungi banner Business ricomposto per il box homepage'
          git push origin HEAD:main
